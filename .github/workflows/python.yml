name: python

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'poetry'
      
      - name: Install Dependencies
        run: poetry install

      - name: Run lint
        run: poetry run ruff check . --no-cache

      - name: Run type check
        run: poetry run mypy .