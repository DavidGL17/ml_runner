name: poetry ci

on:
  push:
    branches:
      - master
    tags:
      - 'python_*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: poetry install

      - name: Run lint
        run: poetry run ruff check . --no-cache

      - name: Run type check
        run: poetry run mypy .

  # publish only on tags like python_1.0.0
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/python_')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Check tag matches package version
        run: test "python_$(poetry version -s)" = "${GITHUB_REF_NAME}"

      - name: Build package
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1