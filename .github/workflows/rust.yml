name: rust

on:
  push:
    branches:
      - master
    tags:
      - 'rust_[0-9]+.[0-9]+.[0-9]+'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        FEATURE: [default, simd, blas]
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies for blas
        if: matrix.FEATURE == 'blas'
        run: sudo apt install -y libopenblas-dev pkg-config
      - name: Build binaries in "${{ matrix.FEATURE }}" mode
        run: cargo build -F ${{ matrix.FEATURE }}
      - name: Run tests in "${{ matrix.FEATURE }}" mode
        run: cargo test -F ${{ matrix.FEATURE }}

  # publish only on tags like rust_1.0.0
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/rust_')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Login into crates.io
        run: cargo login ${{ secrets.CRATES_IO }}
      - name: Build binaries in "release" mode
        run: cargo build -r
      - name: "Package for crates.io"
        run: cargo package # verification step before publishing
      - name: "Publish to crates.io"
        run: cargo publish