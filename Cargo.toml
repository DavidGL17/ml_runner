[package]
name = "ml_runner"
version = "1.0.0"
edition = "2024"
license-file = "LICENSE"
description = "A Rust crate for running machine learning models, with optional SIMD and BLAS support."
homepage = "https://github.com/DavidGL17/ml_runner"
repository = "https://github.com/DavidGL17/ml_runner"
readme = "README.md" 
exclude = [
    "legacy_c_code/**",
    "misc_notebooks/**",
    "ml_runner_exporter/**",
    "tests/**",
    "pyproject.toml",
    "poetry.lock",
    "**.ipynb",
    "**.py",
    ".github/**",
]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
ndarray = { version = "0.16", features = ["serde"] }
wide = { version = "0.7", optional = true }

# Only pulled in when the `blas` feature is enabled - see below.
blas-src = { version = "0.10", optional = true, default-features = false, features = ["openblas"] }
openblas-src = { version = "0.10", optional = true, default-features = false, features = ["system", "cblas"] }

[features]
default = []

simd = ["dep:wide"]

blas = ["ndarray/blas", "dep:blas-src", "dep:openblas-src"]

[dev-dependencies]
approx = "0.5.1"

[build-dependencies]
pkg-config = "0.3"
